algorithm:
  name: SAC
  gamma: 0.99
  alpha: 0.01
  actor_learning_rate: 1e-4
  critic_learning_rate: 3e-4
  batch_size: 512
  tau: 0.005
  replay_buffer_size: 100000
  warmup_steps: 1000
  total_steps: 10000000
  update_frequency: 1
  policy_update_frequency: 2
  save_interval: 50000
  log_interval: 1000
  hidden_dim: 64
  use_layer_norm: false
  max_tasks: 400
  device: auto
  eval_frequency: 0
  eval_episodes: 0
  use_attention: false

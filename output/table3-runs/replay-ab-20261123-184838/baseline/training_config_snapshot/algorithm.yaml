algorithm:
  name: SAC
  gamma: 0.99
  alpha: 0.01
  actor_learning_rate: 1.0e-4
  critic_learning_rate: 3.0e-4
  optimizer: Adam
  batch_size: 512
  tau: 0.005
  replay_buffer_size: 100000
  warmup_steps: 1000
  total_steps: 10000000
  update_frequency: 1
  policy_update_frequency: 2
  hidden_dim: 64
  max_tasks: 400
  device: auto
  use_attention: false
  use_layer_norm: false
  training_seed: 42
  save_interval: 10000
  log_interval: 100
